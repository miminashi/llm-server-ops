# t120h-p100 (Tesla P100-PCIE-16GB x4, sm_60) / Qwen3.8-27B (dense) split-mode bench — MTP on
# 手本: report/2026-09-14_104905_aws_gpu01_split_mode_layer_vs_tensor.md (aws-gpu01 P100 x7)
BIN=$HOME/llama.cpp/build/bin/llama-server
MODEL=$HOME/models/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf
DEVICES=CUDA0,CUDA1,CUDA2,CUDA3
MODES=( "layer|CUDA0,CUDA1,CUDA2,CUDA3|layer" \
        "tensor|CUDA0,CUDA1,CUDA2,CUDA3|tensor" \
        "layer2|CUDA0,CUDA1|layer" )
BASELINE=layer2
CTX=131072
STAGES=0,16000,32000,64000,128000
N_PREDICT=1000
PP0_SIZES=512,2048,8192
THREADS=16
SPEC_ARGS="--spec-type draft-mtp --spec-draft-n-max 2"   # MTP 有効（前回 2026-09-18_131856 からの唯一の変更点。aws-gpu01 MTP 系列と同値）
EXTRA_ARGS=""           # -b/-ub は指定しない (手本と同一条件。ビルド既定 -b 2048 -ub 512)
LAUNCH_PREFIX=""        # 既定の NCCL 経路 (NCCL 2.31.2 リンク済み)
TENSOR_SPLIT=""
VENV_PY=/usr/bin/python3   # 作図は WS 側で行うため matplotlib は不要 (BENCH-FIGFAIL は想定内)
MACHINE="t120h-p100 - Tesla P100-PCIE-16GB x4 (sm_60, PCIe, no NVLink)"
